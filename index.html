<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#F3F6F7;
  --panel:#FFFFFF;
  --panel-alt:#EFF3F4;
  --line:#DCE3E5;
  --text:#1E2A2E;
  --muted:#6B7A80;
  --teal:#0E9E90;
  --amber:#C97E00;
  --red:#D2454E;
  --green:#1E9A5F;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
}
h1,h2,.brand,.statval{font-family:'Space Grotesk',sans-serif;}

.topbar{
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:14px 16px;
}
.brand-row{display:flex; align-items:center; gap:10px;}
.logo{
  width:30px; height:30px; border-radius:7px;
  background:linear-gradient(135deg, var(--teal), #0a6b61);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#FFFFFF; font-size:12px; font-family:'Space Grotesk',sans-serif;
  flex-shrink:0;
}
.brand{font-weight:700; font-size:16px; letter-spacing:-.3px;}
.storeNameInput{
  background:transparent; border:none; color:var(--muted);
  font-family:'IBM Plex Mono',monospace; font-size:12px;
  margin-left:auto; text-align:right; width:150px;
}
.storeNameInput:focus{outline:none; color:var(--text);}

.stats-strip{display:flex; gap:8px; margin-top:12px;}
.chip{
  flex:1;
  background:var(--panel-alt);
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 10px;
}
.chip .statval{font-size:17px; font-weight:600;}
.chip .statlbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-top:1px;}
.chip.risk .statval{color:var(--amber);}
.chip.saved .statval{color:var(--green);}
.chip.lost .statval{color:var(--red);}

main{padding:14px 12px 50px; max-width:760px; margin:0 auto;}
.loading{text-align:center; padding:40px; color:var(--muted); font-size:13px;}

.toolbar{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px;
  margin-bottom:14px;
}
.toolbar-head{
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer;
}
.toolbar-head span{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px;}
.toolbar-head .chev{color:var(--muted); font-size:12px; transition:transform .15s;}
.toolbar-head.open .chev{transform:rotate(180deg);}
.addform{display:none; margin-top:12px;}
.addform.open{display:block;}
.addform .grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
.addform input{
  background:var(--panel-alt);
  border:1px solid var(--line);
  border-radius:5px;
  padding:9px 10px;
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  width:100%;
}
.addform input:focus{outline:1px solid var(--teal);}
.addform input::placeholder{color:#55606C;}
button.add-btn{
  width:100%;
  background:var(--teal);
  color:#FFFFFF;
  border:none;
  border-radius:5px;
  padding:10px;
  font-weight:600;
  font-family:'Space Grotesk',sans-serif;
  font-size:13.5px;
  cursor:pointer;
}
button.add-btn:hover{background:#4fe0cc;}

.tabs{display:flex; gap:6px; margin-bottom:10px; overflow-x:auto;}
.tab{
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:20px;
  padding:6px 13px;
  font-size:12px;
  font-family:'IBM Plex Mono',monospace;
  cursor:pointer;
  white-space:nowrap;
}
.tab.active{background:var(--teal); color:#FFFFFF; border-color:var(--teal); font-weight:600;}

.table-wrap{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
}
.trow{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  align-items:center;
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  border-left:3px solid transparent;
}
.trow:last-child{border-bottom:none;}
.trow.urgent{border-left-color:var(--red);}
.trow.soon{border-left-color:var(--amber);}
.trow.ok{border-left-color:var(--green);}
.trow .pname{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; color:var(--text);}
.trow .pmeta{font-size:11px; color:var(--muted); margin-top:2px;}
.badge{
  font-size:10.5px;
  font-weight:600;
  padding:3px 8px;
  border-radius:4px;
  white-space:nowrap;
  text-align:center;
}
.badge.urgent{background:rgba(242,84,91,.15); color:var(--red);}
.badge.soon{background:rgba(245,165,36,.15); color:var(--amber);}
.badge.ok{background:rgba(61,214,140,.15); color:var(--green);}
.rowactions{display:flex; flex-direction:column; gap:4px;}
.rowactions button{
  border:1px solid var(--line);
  background:var(--panel-alt);
  color:var(--text);
  border-radius:4px;
  font-size:10.5px;
  padding:4px 7px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
}
.rowactions button.sell{color:var(--green); border-color:#235540;}
.rowactions button.lose{color:var(--red); border-color:#5a2a2d;}

.empty{text-align:center; padding:30px; color:var(--muted); font-size:12.5px;}

.save-btn{
  background:var(--panel-alt);
  border:1px solid var(--line);
  color:var(--teal);
  border-radius:6px;
  padding:7px 12px;
  font-size:12px;
  font-weight:600;
  font-family:'IBM Plex Mono',monospace;
  cursor:pointer;
  margin-left:8px;
  white-space:nowrap;
}
.save-btn:active{background:var(--teal); color:#fff;}
.save-confirm{font-size:11px; color:var(--green); margin-left:6px; opacity:0; transition:opacity .2s;}
.save-confirm.show{opacity:1;}

.gate{
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg);
  padding:20px;
}
.gate-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:26px 22px;
  max-width:320px;
  width:100%;
  text-align:center;
}
.gate-box .logo{margin:0 auto 14px;}
.gate-box h2{font-size:16px; margin:0 0 4px;}
.gate-box p{font-size:12px; color:var(--muted); margin:0 0 16px;}
.gate-box input{
  width:100%;
  background:var(--panel-alt);
  border:1px solid var(--line);
  border-radius:6px;
  padding:10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  text-align:center;
  color:var(--text);
  margin-bottom:10px;
  letter-spacing:1px;
}
.gate-box input:focus{outline:1px solid var(--teal);}
.gate-err{color:var(--red); font-size:11.5px; margin-bottom:8px; min-height:14px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(20,28,30,.45);
  display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:20px; max-width:300px; width:100%;
}
.modal-box h3{font-size:14.5px; margin:0 0 3px; font-family:'Space Grotesk',sans-serif;}
.modal-box .modal-sub{font-size:11.5px; color:var(--muted); margin:0 0 14px;}
.modal-box label{font-size:11px; color:var(--muted); display:block; margin-bottom:5px;}
.modal-box input{
  width:100%; background:var(--panel-alt); border:1px solid var(--line); border-radius:6px;
  padding:9px 10px; font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--text);
  margin-bottom:12px;
}
.modal-box input:focus{outline:1px solid var(--teal);}
.modal-actions{display:flex; gap:8px;}
.modal-actions button{
  flex:1; border-radius:6px; padding:9px; font-size:12.5px; font-weight:600;
  font-family:'IBM Plex Mono',monospace; cursor:pointer; border:1px solid var(--line);
}
.modal-actions .confirm{background:var(--teal); color:#fff; border-color:var(--teal);}
.modal-actions .cancel{background:var(--panel-alt); color:var(--text);}
</style>

  import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  try {
    const firebaseConfig = {
      apiKey: "AIzaSyANaep7ecov2nScpQrnpgg9DLvrHsejprY",
      authDomain: "s5-exotique-stock.firebaseapp.com",
      databaseURL: "https://s5-exotique-stock-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "s5-exotique-stock",
      storageBucket: "s5-exotique-stock.firebasestorage.app",
      messagingSenderId: "746133063422",
      appId: "1:746133063422:web:f2bcd4522141d14de0c7af"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.__fbResolve({ db, ref, get, set, onValue });
  } catch (e) { window.__fbReject(e); }
</script>
</head>
<body>


<div id="gate" class="gate">
  <div class="gate-box">
    <div class="logo" style="width:40px;height:40px;font-size:15px;">OS</div>
    <h2>One Stock</h2>
    <p>Entrez le code de votre commerce</p>
    <div class="gate-err" id="gateErr">&nbsp;</div>
    <input id="gateInput" type="password" placeholder="Code" autocomplete="off" />
    <button class="add-btn" id="gateBtn" type="button">Entrer</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand-row">
      <div class="logo">OS</div>
      <div class="brand">One Stock</div>
      <span class="storeNameInput" id="storeLabel" style="font-weight:600; color:var(--text);"></span>
      <button class="save-btn" id="logoutBtn" type="button" style="margin-left:8px; color:var(--red);">⏻ Déconnecter</button>
    </div>
    <div class="stats-strip">
      <div class="chip risk"><div class="statval" id="statRisk">0€</div><div class="statlbl">à risque</div></div>
      <div class="chip saved"><div class="statval" id="statSaved">0€</div><div class="statlbl">sauvé</div></div>
      <div class="chip lost"><div class="statval" id="statLost">0€</div><div class="statlbl">perdu</div></div>
    </div>
    <div style="display:flex; align-items:center; margin-top:8px;">
      <button class="save-btn" id="saveBtn" type="button">💾 Sauvegarder</button>
      <span class="save-confirm" id="saveConfirm">Enregistré ✓</span>
      <span id="connStatus" style="font-size:11px; margin-left:10px; color:var(--muted);">● connexion…</span>
    </div>
  </div>

  <main>
    <div id="loading" class="loading">Chargement…</div>
    <div id="content" style="display:none;">

      <div class="toolbar">
        <div class="toolbar-head" id="toolbarHead">
          <span>+ Ajouter un produit</span>
          <span class="chev">▾</span>
        </div>
        <form class="addform" id="addForm">
          <div class="grid">
            <input id="pName" placeholder="Nom du produit" style="grid-column:1/3;"/>
            <input id="pQty" type="number" min="1" value="1" placeholder="Quantité"/>
            <input id="pPrice" type="number" min="0" step="0.01" placeholder="Prix unitaire €"/>
            <input id="pDlc" type="date" style="grid-column:1/3;"/>
          </div>
          <div id="addFormErr" style="display:none; color:var(--red); font-size:11.5px; margin-bottom:8px;"></div>
          <button class="add-btn" type="submit">Ajouter au stock</button>
        </form>
      </div>

      <div class="tabs">
        <div class="tab active" data-filter="all">Tous</div>
        <div class="tab" data-filter="urgent">Urgent</div>
        <div class="tab" data-filter="soon">Cette semaine</div>
        <div class="tab" data-filter="ok">Plus tard</div>
      </div>

      <div class="table-wrap" id="tableWrap"></div>

    </div>
  </main>
</div>

<div class="modal-overlay" id="qtyModal">
  <div class="modal-box">
    <h3 id="qtyModalTitle">Quantité</h3>
    <p class="modal-sub" id="qtyModalSub"></p>
    <label id="qtyModalLabel">Quantité concernée</label>
    <input type="number" id="qtyModalInput" min="1" />
    <div class="modal-actions">
      <button class="cancel" type="button" onclick="closeQtyModal()">Annuler</button>
      <button class="confirm" type="button" id="qtyModalConfirm">Confirmer</button>
    </div>
  </div>
</div>

<script>
let products = [];
let stats = { saved: 0, lost: 0 };
let currentFilter = 'all';

// ===== COMMERCES =====
// Une ligne par commerce : "CODE": { name: "Nom affiché", path: "stores/CODE" }
// Pour ajouter un commerce, ajoute une ligne ici avec un nouveau code.
const STORES = {
  "0625S5": { name: "S5 Exotique", path: "stock/main" },   // données d'origine conservées
  "1494": { name: "Vayra Super Marché", path: "stores/1494" },
  "9135": { name: "Les 3 Fils", path: "stores/9135" },
  "1213": { name: "BT Market", path: "stores/7719" }
};
let currentStore = null;

function openStore(code){
  currentStore = STORES[code];
  try{ sessionStorage.setItem('sf_store', code); }catch(e){}
  document.getElementById('storeLabel').textContent = currentStore.name;
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  loadAll();
}

function tryUnlock(){
  const val = document.getElementById('gateInput').value.trim().toUpperCase();
  if(STORES[val]){
    document.getElementById('gateErr').innerHTML = '&nbsp;';
    document.getElementById('gateInput').value = '';
    openStore(val);
  } else {
    document.getElementById('gateErr').textContent = 'Code incorrect, réessaie.';
  }
}
document.getElementById('gateBtn').addEventListener('click', tryUnlock);
document.getElementById('gateInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  try{ sessionStorage.removeItem('sf_store'); }catch(e){}
  currentStore = null; dataRef = null;
  products = []; stats = { saved:0, lost:0 };
  document.getElementById('content').style.display='none';
  const l = document.getElementById('loading');
  l.style.display='block'; l.textContent = 'Chargement…';
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
});

(function checkGateOnLoad(){
  let code = null;
  try{ code = sessionStorage.getItem('sf_store'); }catch(e){}
  if(code && STORES[code]) openStore(code);
})();

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const result = await saveAll();
  const c = document.getElementById('saveConfirm');
  if(result.ok){
    c.textContent = 'Enregistré ✓';
    c.style.color = 'var(--green)';
  } else {
    c.textContent = '⚠ ' + result.msg;
    c.style.color = 'var(--red)';
  }
  c.classList.add('show');
  setTimeout(()=>c.classList.remove('show'), 6000);
});

let dataRef = null;
let dbErrorMsg = null;

async function loadAll(){
  const loadingEl = document.getElementById('loading');
  try{
    const fb = await Promise.race([window.__fbReady, new Promise((_, rej) => setTimeout(() => rej(new Error('Connexion à la base trop longue')), 12000))]);
    window.__fb = fb;
    dataRef = fb.ref(fb.db, currentStore.path);
    try{
      fb.onValue(fb.ref(fb.db, '.info/connected'), (cs) => {
        const el = document.getElementById('connStatus');
        if(!el) return;
        if(cs.val() === true){ el.textContent = '● en ligne'; el.style.color = 'var(--green)'; }
        else { el.textContent = '● hors ligne'; el.style.color = 'var(--red)'; }
      });
    }catch(e){}
    const snap = await fb.get(dataRef);
    if(snap.exists()){
      const data = snap.val() || {};
      products = Array.isArray(data.products) ? JSON.parse(JSON.stringify(data.products)) : [];
      stats = data.stats && typeof data.stats === 'object' ? JSON.parse(JSON.stringify(data.stats)) : { saved:0, lost:0 };
      if(typeof stats.saved !== 'number') stats.saved = 0;
      if(typeof stats.lost !== 'number') stats.lost = 0;
    } else {
      products = [];
      stats = { saved:0, lost:0 };
    }
  }catch(e){
    console.error(e);
    dbErrorMsg = "Impossible de charger les données (" + (e && e.message ? e.message : e) + ")." + (/permission[_ ]denied/i.test(String(e && (e.code + ' ' + e.message))) ? " Règles Firebase : mets « .read »: true et « .write »: true puis Publier." : "");
    loadingEl.textContent = '⚠ ' + dbErrorMsg;
    return;
  }
  loadingEl.style.display='none';
  document.getElementById('content').style.display='block';
  render();
}
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject({ code:'timeout', message:'La sauvegarde ne répond pas après ' + (ms/1000) + 's.' }), ms))
  ]);
}
let saveInProgress = false;

async function saveAll(){
  if(!dataRef) return { ok:false, msg: 'Pas de connexion à la base (dataRef manquant).' };
  if(saveInProgress) return { ok:false, msg: 'Une sauvegarde est déjà en cours, réessaie dans un instant.' };
  saveInProgress = true;
  try{
    await withTimeout(window.__fb.set(dataRef, {
      products,
      stats,
      storeName: currentStore ? currentStore.name : ''
    }), 8000);
    return { ok:true };
  }catch(e){
    console.error('Erreur sauvegarde', e);
    const code = e && e.code ? e.code : 'inconnu';
    const msg = e && e.message ? e.message : String(e);
    let hint = '';
    if(/permission[_ ]denied/i.test(code + ' ' + msg)) hint = " → Firebase refuse l'écriture : onglet Règles de Realtime Database, vérifie « .write »: true puis Publier.";
    else if(code === 'timeout') hint = " → la base ne répond pas : vérifie la connexion ou l'adresse databaseURL.";
    return { ok:false, msg: `[${code}] ${msg}${hint}` };
  }finally{
    saveInProgress = false;
  }
}
// gardés pour compatibilité avec le reste du code
async function saveProducts(){ return saveAll(); }
async function saveStats(){ return saveAll(); }

document.getElementById('toolbarHead').addEventListener('click', ()=>{
  document.getElementById('toolbarHead').classList.toggle('open');
  document.getElementById('addForm').classList.toggle('open');
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    render();
  });
});

function daysLeft(dlc){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dlc); d.setHours(0,0,0,0);
  return Math.round((d-today)/86400000);
}
function suggestedDiscount(days){
  if(days <= 0) return 60;
  if(days <= 2) return 40;
  if(days <= 5) return 20;
  return 0;
}
function statusOf(days){
  if(days<=2) return 'urgent';
  if(days<=5) return 'soon';
  return 'ok';
}

document.getElementById('addForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const errEl = document.getElementById('addFormErr');
  errEl.style.display = 'none';

  const name = document.getElementById('pName').value.trim();
  const qty = parseFloat(document.getElementById('pQty').value);
  const price = parseFloat(document.getElementById('pPrice').value);
  const dlc = document.getElementById('pDlc').value;

  const missing = [];
  if(!name) missing.push('le nom du produit');
  if(!qty || qty < 1) missing.push('la quantité');
  if(price === '' || isNaN(price) || price < 0) missing.push('le prix unitaire');
  if(!dlc) missing.push('la date de DLC');
  if(missing.length){
    errEl.textContent = 'Manquant : ' + missing.join(', ') + '.';
    errEl.style.display = 'block';
    return;
  }
  const newProduct = { id: Date.now().toString(36), name, qty, price, dlc };
  products.push(newProduct);
  render();

  const result = await saveAll();
  if(!result.ok){
    products = products.filter(p => p.id !== newProduct.id);
    render();
    errEl.textContent = "⚠ Échec de l'ajout : " + result.msg;
    errEl.style.display = 'block';
    return;
  }
  e.target.reset();
  document.getElementById('pQty').value = 1;
});

let pendingAction = null; // { id, type }

function openQtyModal(id, type){
  const p = products.find(p=>p.id===id);
  if(!p) return;
  pendingAction = { id, type };
  document.getElementById('qtyModalTitle').textContent = type==='sold' ? 'Produit vendu' : 'Produit jeté';
  document.getElementById('qtyModalSub').textContent = `${p.name} — ${p.qty} en stock`;
  const input = document.getElementById('qtyModalInput');
  input.max = p.qty;
  input.min = 1;
  input.value = p.qty;
  document.getElementById('qtyModal').classList.add('open');
  input.focus();
}
function closeQtyModal(){
  document.getElementById('qtyModal').classList.remove('open');
  pendingAction = null;
}
document.getElementById('qtyModalConfirm').addEventListener('click', ()=>{
  if(!pendingAction) return;
  const p = products.find(p=>p.id===pendingAction.id);
  if(!p){ closeQtyModal(); return; }
  let qty = parseInt(document.getElementById('qtyModalInput').value, 10);
  if(!qty || qty < 1) qty = 1;
  if(qty > p.qty) qty = p.qty;
  applyAction(pendingAction.type, p.id, qty);
  closeQtyModal();
});
document.getElementById('qtyModalInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') document.getElementById('qtyModalConfirm').click();
});

async function applyAction(type, id, qty){
  const idx = products.findIndex(p=>p.id===id);
  if(idx<0) return;
  const p = products[idx];

  // snapshot pour pouvoir annuler si la sauvegarde échoue
  const prevProducts = JSON.parse(JSON.stringify(products));
  const prevStats = JSON.parse(JSON.stringify(stats));

  if(type === 'sold'){
    const days = daysLeft(p.dlc);
    const discount = suggestedDiscount(days);
    const fullValue = qty * p.price;
    const received = fullValue * (1 - discount/100);
    stats.saved += received;
    stats.lost += (fullValue - received);
  } else {
    stats.lost += qty * p.price;
  }

  const remaining = p.qty - qty;
  if(remaining > 0){
    products[idx] = { ...p, qty: remaining };
  } else {
    products.splice(idx,1);
  }
  render();

  const result = await saveAll();
  if(!result.ok){
    products = prevProducts;
    stats = prevStats;
    render();
    const c = document.getElementById('saveConfirm');
    c.textContent = '⚠ ' + result.msg;
    c.style.color = 'var(--red)';
    c.classList.add('show');
    setTimeout(()=>c.classList.remove('show'), 6000);
  }
}

function markSold(id){ openQtyModal(id, 'sold'); }
function markLost(id){ openQtyModal(id, 'lost'); }

function rowHtml(p){
  const days = daysLeft(p.dlc);
  const status = statusOf(days);
  const discount = suggestedDiscount(days);
  const value = (p.qty*p.price).toFixed(2);
  const dayLabel = days<=0 ? 'Dépassée' : days+'j';
  return `<div class="trow ${status}">
    <div>
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pmeta">${p.qty}x · ${value}€${discount>0 ? ' · remise -'+discount+'% conseillée' : ''}</div>
    </div>
    <span class="badge ${status}">${dayLabel}</span>
    <div class="rowactions">
      <button class="sell" onclick="markSold('${p.id}')">Vendu</button>
      <button class="lose" onclick="markLost('${p.id}')">Jeté</button>
    </div>
  </div>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  document.getElementById('statSaved').textContent = Math.round(stats.saved)+'€';
  document.getElementById('statLost').textContent = Math.round(stats.lost)+'€';

  const sorted = [...products].sort((a,b)=>daysLeft(a.dlc)-daysLeft(b.dlc));
  const risk = sorted.filter(p=>daysLeft(p.dlc)<=5).reduce((sum,p)=>sum+p.qty*p.price,0);
  document.getElementById('statRisk').textContent = Math.round(risk)+'€';

  let filtered = sorted;
  if(currentFilter !== 'all'){
    filtered = sorted.filter(p=>statusOf(daysLeft(p.dlc))===currentFilter);
  }

  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = filtered.length ? filtered.map(rowHtml).join('') : '<div class="empty">Aucun produit dans cette vue.</div>';
}

</script>

</body>
</html>
